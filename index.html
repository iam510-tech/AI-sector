<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sector Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
    --text:#e8e8f0;--text2:#8888a0;--text3:#555568;
    --accent:#7c6af5;--accent2:#5a4fd4;
    --green:#3ecf8e;--red:#f04040;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans KR',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}

  .header{border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;background:rgba(10,10,15,0.96);backdrop-filter:blur(12px);z-index:100}
  .logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.08em}
  .sep{width:1px;height:20px;background:var(--border2)}
  .sub{font-size:12px;color:var(--text3);font-family:var(--mono)}
  .btn-add{margin-left:auto;background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .15s}
  .btn-add:hover{border-color:var(--accent);color:var(--accent)}

  .layout{display:flex;height:calc(100vh - 53px)}

  .sidebar{width:256px;min-width:256px;border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
  .sector-group{border-bottom:1px solid var(--border)}
  .sector-header{padding:11px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:color .15s}
  .sector-header:hover{color:var(--text2)}
  .sector-header.open{color:var(--accent)}
  .sector-count{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg3);color:var(--text3)}
  .sector-header.open .sector-count{background:rgba(124,106,245,.15);color:var(--accent)}
  .tier-label{padding:8px 16px 3px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .tdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .thint{font-size:9px;color:var(--text3)}
  .stock-item{padding:7px 16px 7px 24px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s;border-left:2px solid transparent}
  .stock-item:hover{background:var(--bg3)}
  .stock-item.active{background:rgba(124,106,245,.1);border-left-color:var(--accent)}
  .sname{font-size:13px;color:var(--text)}
  .sticker{font-family:var(--mono);font-size:10px;color:var(--text3)}
  .noticker{font-size:9px;color:var(--text3);font-style:italic}

  .main{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;color:var(--text3)}
  .empty-icon{font-size:28px;opacity:.2}
  .empty-hint{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
  .sector-note{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:13px 18px;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.8;max-width:540px}

  .detail{padding:28px 32px;max-width:960px}
  .dname{font-size:22px;font-weight:500;margin-bottom:6px}
  .dmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .badge{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:3px}
  .bt{color:var(--accent);background:rgba(124,106,245,.12)}
  .bs{color:var(--text3)}

  .chart-section{margin-bottom:18px}
  .chart-toolbar{display:flex;align-items:center;gap:3px;padding:9px 13px;background:var(--bg2);border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0}
  .pbtn{background:transparent;border:none;color:var(--text3);font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:3px;cursor:pointer;transition:all .12s}
  .pbtn:hover{color:var(--text2);background:var(--bg3)}
  .pbtn.active{color:var(--accent);background:rgba(124,106,245,.15)}
  .tspc{flex:1}
  .csrc{font-family:var(--mono);font-size:9px;color:var(--text3)}
  .chart-img-wrap{background:#0d1117;border:1px solid var(--border);border-radius:0 0 6px 6px;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}
  .chart-img-wrap img{width:100%;display:block}
  .cerr{font-family:var(--mono);font-size:11px;color:var(--text3);padding:50px;text-align:center;line-height:2}
  .no-chart{background:var(--bg2);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:140px;gap:8px;color:var(--text3);font-family:var(--mono);font-size:11px}

  .ext-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ext-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:6px 13px;border-radius:4px;text-decoration:none;transition:all .15s}
  .ext-link:hover{border-color:var(--accent);color:var(--accent)}
  .ext-link svg{width:11px;height:11px;flex-shrink:0}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:28px;width:460px;max-width:92vw}
  .mtitle{font-family:var(--mono);font-size:12px;color:var(--text);margin-bottom:20px;letter-spacing:.06em}
  .mfield{margin-bottom:13px}
  .mlabel{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
  .minput{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 11px;border-radius:4px;outline:none;transition:border-color .15s}
  .minput:focus{border-color:var(--accent)}
  .mta{height:90px;resize:vertical}
  .mhint{font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono)}
  .mactions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
  .btn-cancel{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:11px;padding:7px 15px;border-radius:4px;cursor:pointer}
  .btn-ok{background:var(--accent2);border:none;color:#fff;font-family:var(--mono);font-size:11px;padding:7px 15px;border-radius:4px;cursor:pointer}
  .btn-ok:hover{background:var(--accent)}

  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <span class="logo">AI SECTOR TRACKER</span>
  <div class="sep"></div>
  <span class="sub">iam_510</span>
  <button class="btn-add" onclick="openModal()">+ 섹터 추가</button>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="mtitle">// NEW_SECTOR</div>
    <div class="mfield"><div class="mlabel">섹터명</div><input class="minput" id="ms-name" placeholder="예: Memory / Robotics"></div>
    <div class="mfield"><div class="mlabel">섹터 설명 (선택)</div><input class="minput" id="ms-desc" placeholder="한 줄 설명"></div>
    <div class="mfield">
      <div class="mlabel">종목 (한 줄에 하나 — 이름, 티어, 티커)</div>
      <textarea class="minput mta" id="ms-stocks" placeholder="SK Hynix, High, 000660.KS&#10;Micron, High, MU"></textarea>
      <div class="mhint">티커 없으면 빈칸. 티어는 자유롭게 (High / Mid / Low / Early 등)</div>
    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-ok" onclick="addSector()">추가</button>
    </div>
  </div>
</div>

<script>
const EXT_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>`;

const TIER_COLORS = {'High':'#f5a623','High-Mid':'#e8883a','Mid':'#7c6af5','Mid-Low':'#4a9eff','Low':'#3ecf8e','Very Early':'#f04040','Early':'#e8883a','Early-Mid':'#f5a623','Mid Late':'#4a9eff','Mature':'#3ecf8e','default':'#888899'};
const TIER_HINTS = {'Very Early':'초기 수혜','Early':'선행 수혜','Early-Mid':'중간 선행','Mid Late':'후행','Mature':'성숙기'};
const SECTOR_TIER_ORDER = {
  'Power':['High','High-Mid','Mid','Mid-Low','Low'],
  'Optical':['Very Early','Early','Early-Mid','Mid','Mid Late','Mature'],
  '_default':['High','High-Mid','Mid','Mid-Low','Low','Very Early','Early','Early-Mid','Mid Late','Mature']
};
const PERIODS = {d:'일봉', w:'주봉', m:'월봉'};

let sectors = {
  'Power':{
    label:'AI · Power',
    note:'800V → 48V → 0.8V → μV 전압 강하 체인. Vera Rubin 세대 전환(2025~2026)이 핵심 카탈리스트. <strong>High</strong> 티어(발전·송전)가 선행하고, 이후 <strong>Mid</strong>(랙·쿨링), <strong>Low</strong>(PMIC·GaN)으로 파급.',
    stocks:[
      {name:'GE Vernova',tier:'High',ticker:'GEV'},{name:'Bloom Energy',tier:'High',ticker:'BE'},
      {name:'Constellation',tier:'High',ticker:'CEG'},{name:'Vistra',tier:'High',ticker:'VST'},
      {name:'Quanta',tier:'High',ticker:'PWR'},{name:'Talen',tier:'High',ticker:'TLN'},
      {name:'Powell',tier:'High',ticker:'POWL'},{name:'Eaton',tier:'High-Mid',ticker:'ETN'},
      {name:'ABB',tier:'High-Mid',ticker:'ABBN.SW'},{name:'Vertiv',tier:'Mid',ticker:'VRT'},
      {name:'Schneider',tier:'Mid',ticker:'SU.PA'},{name:'nVent',tier:'Mid',ticker:'NVT'},
      {name:'Delta',tier:'Mid',ticker:'2308.TW'},{name:'Legrand',tier:'Mid-Low',ticker:'LGRDY'},
      {name:'AEIS',tier:'Mid-Low',ticker:'AEIS'},{name:'MPS',tier:'Low',ticker:'MPWR'},
      {name:'Vicor',tier:'Low',ticker:'VICR'},{name:'Infineon',tier:'Low',ticker:'IFNNY'},
      {name:'STM',tier:'Low',ticker:'STM'},{name:'Murata',tier:'Low',ticker:'6981.T'},
      {name:'TDK',tier:'Low',ticker:'6762.T'},{name:'Amphenol',tier:'Low',ticker:'APH'},
      {name:'Navitas',tier:'Low',ticker:'NVTS'},{name:'삼성전기',tier:'Low',ticker:'009150.KS'},
    ]
  },
  'Optical':{
    label:'AI · Optical',
    note:'800G→1.6T 속도 전환과 CPO(Co-packaged Optics) 채택이 핵심 드라이버. <strong>Very Early</strong>는 기술 초기 검증, <strong>Early</strong>는 선행 수혜, <strong>Mid</strong>는 수주 가시성 확보 시점.',
    stocks:[
      {name:'LWLG',tier:'Very Early',ticker:'LWLG'},{name:'QCi',tier:'Very Early',ticker:null},
      {name:'Aeluma',tier:'Very Early',ticker:'ALMU'},{name:'POET',tier:'Very Early',ticker:'POET'},
      {name:'Marvell',tier:'Early',ticker:'MRVL'},{name:'AAOI',tier:'Early',ticker:'AAOI'},
      {name:'Innolight',tier:'Early',ticker:null},{name:'Eoptolink',tier:'Early',ticker:null},
      {name:'Yuanjie',tier:'Early',ticker:null},{name:'nLIGHT',tier:'Early',ticker:null},
      {name:'Ciena',tier:'Early',ticker:'CIEN'},{name:'Astera Labs',tier:'Early',ticker:'ALAB'},
      {name:'Semtech',tier:'Early',ticker:'SMTC'},{name:'Lumentum',tier:'Early-Mid',ticker:'LITE'},
      {name:'Coherent',tier:'Early-Mid',ticker:'COHR'},{name:'Credo',tier:'Early-Mid',ticker:'CRDO'},
      {name:'Sivers',tier:'Early-Mid',ticker:null},{name:'Cisco',tier:'Mid',ticker:'CSCO'},
      {name:'Nokia',tier:'Mid',ticker:'NOK'},{name:'Sumimoto',tier:'Mid',ticker:null},
      {name:'MACOM',tier:'Mid Late',ticker:null},{name:'IPG Photonics',tier:'Mature',ticker:null},
    ]
  }
};

let activeSector=null, activeStock=null, currentPeriod='d';

// 미국 상장 티커 여부 (Finviz는 미국 종목만 지원)
function isUSA(ticker) {
  if (!ticker) return false;
  return !/[.\-]/.test(ticker) && !/KS$|KQ$|TW$|PA$|SW$/.test(ticker);
}

function finvizUrl(ticker, p) {
  return `https://finviz.com/chart.ashx?t=${ticker}&ty=c&ta=1&p=${p}`;
}

// ── 사이드바 ──────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = Object.entries(sectors).map(([key,sec])=>{
    const order = SECTOR_TIER_ORDER[key]||SECTOR_TIER_ORDER['_default'];
    const tiers = {};
    sec.stocks.forEach(s=>{ (tiers[s.tier]=tiers[s.tier]||[]).push(s); });
    const sorted = Object.keys(tiers).sort((a,b)=>{
      const ai=order.indexOf(a),bi=order.indexOf(b);
      return (ai<0?99:ai)-(bi<0?99:bi);
    });
    const isOpen = activeSector===key;
    return `<div class="sector-group">
      <div class="sector-header ${isOpen?'open':''}" onclick="toggleSector('${key}')">
        <span>${sec.label}</span><span class="sector-count">${sec.stocks.length}</span>
      </div>
      ${isOpen?sorted.map(tier=>`
        <div>
          <div class="tier-label">
            <span class="tdot" style="background:${TIER_COLORS[tier]||TIER_COLORS.default}"></span>
            ${tier}${TIER_HINTS[tier]?` <span class="thint">${TIER_HINTS[tier]}</span>`:''}
          </div>
          ${tiers[tier].map(s=>`
            <div class="stock-item ${activeStock&&activeStock.name===s.name?'active':''}"
                 onclick="selectStock('${key}','${s.name}','${s.tier}','${s.ticker||''}')">
              <span class="sname">${s.name}</span>
              ${s.ticker?`<span class="sticker">${s.ticker}</span>`:`<span class="noticker">비상장</span>`}
            </div>`).join('')}
        </div>`).join(''):''}
    </div>`;
  }).join('');
}

function toggleSector(key) {
  activeSector = activeSector===key ? null : key;
  if (activeSector) { activeStock=null; showEmpty(); }
  renderSidebar();
}

function selectStock(sk, name, tier, ticker) {
  activeStock = {name, tier, ticker:ticker||null, sector:sectors[sk].label};
  renderSidebar();
  renderDetail();
}

function showEmpty() {
  const note = activeSector ? sectors[activeSector].note : null;
  document.getElementById('main').innerHTML = `<div class="empty-state">
    ${note?`<div class="sector-note">${note}</div>`:'<div class="empty-icon">◈</div>'}
    <div class="empty-hint">← 종목을 선택하세요</div>
  </div>`;
}

// ── 상세 화면 ─────────────────────────────────────────────────────────
function renderDetail() {
  const s = activeStock;
  const usa = isUSA(s.ticker);

  let chartHtml;
  if (s.ticker && usa) {
    const pbtns = Object.entries(PERIODS).map(([k,v])=>
      `<button class="pbtn ${k===currentPeriod?'active':''}" onclick="changePeriod('${k}')">${v}</button>`
    ).join('');
    chartHtml = `<div class="chart-section">
      <div class="chart-toolbar">${pbtns}<div class="tspc"></div><span class="csrc">Finviz</span></div>
      <div class="chart-img-wrap">
        <img id="chart-img" src="${finvizUrl(s.ticker,currentPeriod)}" alt="${s.name} chart"
          onerror="this.outerHTML='<div class=cerr>차트를 불러오지 못했어요<br><small>Finviz에서 직접 확인하세요</small></div>'">
      </div>
    </div>`;
  } else if (s.ticker && !usa) {
    chartHtml = `<div class="no-chart"><span style="opacity:.25;font-size:18px">◌</span><span>해외 거래소 — Finviz 미지원 (${s.ticker})</span></div>`;
  } else {
    chartHtml = `<div class="no-chart"><span style="opacity:.25;font-size:18px">◌</span><span>티커 미등록 종목</span></div>`;
  }

  const links = s.ticker ? `<div class="ext-links">
    <a class="ext-link" href="https://stockanalysis.com/stocks/${s.ticker.toLowerCase().replace(/\./g,'-')}/" target="_blank">${EXT_SVG} Stock Analysis</a>
    ${usa?`<a class="ext-link" href="https://finviz.com/quote.ashx?t=${s.ticker}" target="_blank">${EXT_SVG} Finviz</a>`:''}
  </div>` : '';

  document.getElementById('main').innerHTML = `<div class="detail">
    <div class="dname">${s.name}</div>
    <div class="dmeta">
      ${s.ticker?`<span class="badge bt">${s.ticker}</span>`:''}
      <span class="badge bs">${s.tier}</span>
      <span class="badge bs" style="color:var(--text3)">${s.sector}</span>
    </div>
    ${chartHtml}
    ${links}
  </div>`;
}

function changePeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('active', b.textContent===PERIODS[p]));
  const img = document.getElementById('chart-img');
  if (img && activeStock?.ticker) img.src = finvizUrl(activeStock.ticker, p);
}

// ── 모달 ──────────────────────────────────────────────────────────────
function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ['ms-name','ms-desc','ms-stocks'].forEach(id=>document.getElementById(id).value='');
}
function addSector() {
  const name = document.getElementById('ms-name').value.trim();
  if (!name) return;
  const stocks = document.getElementById('ms-stocks').value.trim()
    .split('\n').filter(l=>l.trim()).map(line=>{
      const p=line.split(',').map(x=>x.trim());
      return {name:p[0]||'',tier:p[1]||'Mid',ticker:p[2]||null};
    }).filter(s=>s.name);
  const key = name.replace(/\s+/g,'_');
  sectors[key]={label:`AI · ${name}`,note:document.getElementById('ms-desc').value.trim(),stocks};
  closeModal(); activeSector=key; activeStock=null;
  renderSidebar(); showEmpty();
}

// init
activeSector='Power';
renderSidebar();
showEmpty();
</script>
</body>
</html>
